name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install literature dependencies
        working-directory: tools/literature
        run: npm ci

      - name: Build literature subpage
        working-directory: tools/literature
        run: npm run build

      - name: Stage literature subpage
        run: |
          mkdir -p public/literature
          cp -R tools/literature/dist/. public/literature/

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          echo "Checking output directory structure:"
          ls -la out/
          echo "Ensuring index.html exists:"
          if [ -f "out/index.html" ]; then
            echo "✓ index.html found"
          else
            echo "⨯ index.html not found"
            echo "Creating a basic index.html..."
            echo '<meta http-equiv="refresh" content="0;url=./app">' > out/index.html
          fi

      - name: Verify literature output
        run: test -f out/literature/index.html

      - name: Create .nojekyll file
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
